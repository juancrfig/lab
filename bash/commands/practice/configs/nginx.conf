server {
    listen 80;
    server_name figuestore.com www.figuestore.com;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://localhost:3000/admin;
    }

    location /health {
        access_log off;
        proxy_pass http://localhost:3000/health;
    }

    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}

server {
    listen 443 ssl;
    server_name figuestore.com;

    ssl_certificate /etc/ssl/certs/figuestore.crt;
    ssl_certificate_key /etc/ssl/private/figuestore.key;

    location / {
        proxy_pass http://localhost:3000;
    }
}
